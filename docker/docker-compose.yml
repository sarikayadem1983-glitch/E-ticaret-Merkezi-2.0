name: ticaret-merkezi

services:
  postgres:
    image: postgres:16-alpine
    container_name: tm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ticaret_merkezi}
      # Used only by init/10-roles.sh on a fresh volume.
      TM_APP_DB_PASSWORD: ${TM_APP_DB_PASSWORD:?TM_APP_DB_PASSWORD is required}
      TM_MIGRATOR_DB_PASSWORD: ${TM_MIGRATOR_DB_PASSWORD:?TM_MIGRATOR_DB_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../database/roles:/sql/roles:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ticaret_merkezi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development and tests only: catches every e-mail, sends nothing out.
  # UI/API: http://localhost:8025 (api/v1/messages). Never in production.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tm-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Yalnızca geliştirme ve test: S3 uyumlu nesne depolama (INF-12).
  # İmaj kaynaktan derlenir (docker/minio/Dockerfile). Production'da kullanılmaz.
  minio:
    build: ./minio
    image: tm-minio:dev
    container_name: tm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-tm-dev-erisim}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-tm-dev-gizli-anahtar}
      MINIO_BUCKET: ${STORAGE_BUCKET:-tm-dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
